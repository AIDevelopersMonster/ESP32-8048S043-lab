name: App 06/07/08/09 - Platform OTA + Widget Runtime Build

on:
  push:
    branches:
      - agent/app06-ota-recovery
      - agent/app07-widget-runtime
      - agent/app08-youtube-dashboard
      - agent/app09-sd-widget-library
    paths:
      - 'apps/06_OTARecovery/**'
      - 'apps/09_SDWidgetLibrary/**'
      - '.github/workflows/app06-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Resolve platform version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < apps/06_OTARecovery/release-version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build platform firmware
        working-directory: apps/06_OTARecovery/idf
        env:
          KONTAKTS_APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
      - name: Assemble images
        working-directory: apps/06_OTARecovery/idf
        env:
          APP06_VERSION: ${{ steps.version.outputs.version }}
        run: |
          . $IDF_PATH/export.sh
          mkdir -p dist
          cp build/app06_ota_recovery.bin "dist/app06-ota-v${APP06_VERSION}.bin"
          cd build
          esptool.py --chip esp32s3 merge_bin -o "../dist/app06-ota-recovery-v${APP06_VERSION}-full.bin" @flash_args
          cd ..
          sha256sum dist/*.bin
      - uses: actions/upload-artifact@v4
        with:
          name: app06-platform-v${{ steps.version.outputs.version }}
          path: |
            apps/06_OTARecovery/idf/dist/*.bin
            apps/06_OTARecovery/idf/build/app06_ota_recovery.elf
            apps/06_OTARecovery/idf/build/app06_ota_recovery.map
            apps/06_OTARecovery/idf/partitions.csv
            apps/06_OTARecovery/widgets/*.json
            apps/09_SDWidgetLibrary/sd/**
          if-no-files-found: error
