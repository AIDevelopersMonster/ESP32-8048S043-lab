# Project: KONTAKTS / ESP32-8048S043 Lab
# Programmer: Sol
# Engineer: Alex Malachevsky

name: Web Flasher - Firmware Catalog

on:
  push:
    branches:
      - main
      - agent/app02-mixed-widgets
      - agent/app03-live-dashboard
      - agent/app05-network-provisioning
      - agent/app05-stability
      - agent/app08-youtube-dashboard
      - agent/app11-usb-serial-terminal
    paths:
      - "apps/01_SixCardSerialDeck/**"
      - "apps/02_MixedWidgets/**"
      - "apps/03_LiveDashboard/**"
      - "apps/05_NetworkProvisioning/**"
      - "apps/06_OTARecovery/**"
      - "apps/09_SDWidgetLibrary/**"
      - "web-flasher/**"
      - ".github/workflows/web-flasher.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the KONTAKTS firmware catalog to GitHub Pages"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-flasher-pages
  cancel-in-progress: false

env:
  APP01_PROJECT_DIR: apps/01_SixCardSerialDeck/idf
  APP01_BIN_NAME: app01-six-card-serial-deck-v1.0.0.bin
  APP02_PROJECT_DIR: apps/02_MixedWidgets/idf
  APP02_BIN_NAME: app02-mixed-widgets-v0.1.1.bin
  APP03_PROJECT_DIR: apps/03_LiveDashboard/idf
  APP03_BIN_NAME: app03-live-dashboard-v0.1.0.bin
  APP05_PROJECT_DIR: apps/05_NetworkProvisioning/idf
  APP05_BIN_NAME: app05-network-provisioning-v0.1.1.bin
  APP08_BIN_NAME: app08-kontakts-platform-v0.2.5-full.bin
  APP11_BIN_NAME: app11-kontakts-platform-v0.3.5-full.bin
  APP11_SOURCE_COMMIT: 7696a8256fc9a799c1bdae5654fedab9f7c64e39

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and merge App 01 with ESP-IDF 5.5.5
        run: |
          docker run --rm \
            -e APP01_BIN_NAME="${APP01_BIN_NAME}" \
            -v "$PWD:/project" \
            -w "/project/${APP01_PROJECT_DIR}" \
            espressif/idf:v5.5.5 \
            bash -lc 'git config --global --add safe.directory /project && idf.py set-target esp32s3 && idf.py build && cd build && esptool.py --chip esp32s3 merge_bin -o "${APP01_BIN_NAME}" @flash_args'

      - name: Build and merge App 02 with ESP-IDF 5.5.5
        run: |
          docker run --rm \
            -e APP02_BIN_NAME="${APP02_BIN_NAME}" \
            -v "$PWD:/project" \
            -w "/project/${APP02_PROJECT_DIR}" \
            espressif/idf:v5.5.5 \
            bash -lc 'git config --global --add safe.directory /project && idf.py set-target esp32s3 && idf.py build && cd build && esptool.py --chip esp32s3 merge_bin -o "${APP02_BIN_NAME}" @flash_args'

      - name: Build and merge App 03 with ESP-IDF 5.5.5
        run: |
          docker run --rm \
            -e APP03_BIN_NAME="${APP03_BIN_NAME}" \
            -v "$PWD:/project" \
            -w "/project/${APP03_PROJECT_DIR}" \
            espressif/idf:v5.5.5 \
            bash -lc 'git config --global --add safe.directory /project && idf.py set-target esp32s3 && idf.py build && cd build && esptool.py --chip esp32s3 merge_bin -o "${APP03_BIN_NAME}" @flash_args'

      - name: Build and merge App 05 with ESP-IDF 5.5.5
        run: |
          docker run --rm \
            -e APP05_BIN_NAME="${APP05_BIN_NAME}" \
            -v "$PWD:/project" \
            -w "/project/${APP05_PROJECT_DIR}" \
            espressif/idf:v5.5.5 \
            bash -lc 'git config --global --add safe.directory /project && idf.py set-target esp32s3 && idf.py build && cd build && esptool.py --chip esp32s3 merge_bin -o "${APP05_BIN_NAME}" @flash_args'

      - name: Prepare pinned App 08 source
        run: |
          rm -rf "$RUNNER_TEMP/app08-source"
          mkdir -p "$RUNNER_TEMP/app08-source"
          git archive app06-v0.2.5 | tar -x -C "$RUNNER_TEMP/app08-source"

      - name: Build and merge pinned KONTAKTS Platform 0.2.5
        run: |
          docker run --rm \
            -e APP08_BIN_NAME="${APP08_BIN_NAME}" \
            -e KONTAKTS_APP_VERSION="0.2.5" \
            -v "$RUNNER_TEMP/app08-source:/project" \
            -w "/project/apps/06_OTARecovery/idf" \
            espressif/idf:v5.5.5 \
            bash -lc 'idf.py set-target esp32s3 && idf.py build && cd build && esptool.py --chip esp32s3 merge_bin -o "${APP08_BIN_NAME}" @flash_args'
          mkdir -p web-flasher-stage/app08
          cp "$RUNNER_TEMP/app08-source/apps/06_OTARecovery/idf/build/${APP08_BIN_NAME}" "web-flasher-stage/app08/${APP08_BIN_NAME}"

      - name: Prepare pinned App 11 source
        run: |
          rm -rf "$RUNNER_TEMP/app11-source"
          mkdir -p "$RUNNER_TEMP/app11-source"
          git archive "${APP11_SOURCE_COMMIT}" | tar -x -C "$RUNNER_TEMP/app11-source"

      - name: Build and merge KONTAKTS Platform 0.3.5
        run: |
          docker run --rm \
            -e APP11_BIN_NAME="${APP11_BIN_NAME}" \
            -e KONTAKTS_APP_VERSION="0.3.5" \
            -v "$RUNNER_TEMP/app11-source:/project" \
            -w "/project/apps/06_OTARecovery/idf" \
            espressif/idf:v5.5.5 \
            bash -lc 'idf.py set-target esp32s3 && idf.py build && cd build && esptool.py --chip esp32s3 merge_bin -o "${APP11_BIN_NAME}" @flash_args'
          mkdir -p web-flasher-stage/app11
          cp "$RUNNER_TEMP/app11-source/apps/06_OTARecovery/idf/build/${APP11_BIN_NAME}" "web-flasher-stage/app11/${APP11_BIN_NAME}"

      - name: Verify merged firmware images
        run: |
          test -s "${APP01_PROJECT_DIR}/build/${APP01_BIN_NAME}"
          test -s "${APP02_PROJECT_DIR}/build/${APP02_BIN_NAME}"
          test -s "${APP03_PROJECT_DIR}/build/${APP03_BIN_NAME}"
          test -s "${APP05_PROJECT_DIR}/build/${APP05_BIN_NAME}"
          test -s "web-flasher-stage/app08/${APP08_BIN_NAME}"
          test -s "web-flasher-stage/app11/${APP11_BIN_NAME}"
          sha256sum "${APP01_PROJECT_DIR}/build/${APP01_BIN_NAME}"
          sha256sum "${APP02_PROJECT_DIR}/build/${APP02_BIN_NAME}"
          sha256sum "${APP03_PROJECT_DIR}/build/${APP03_BIN_NAME}"
          sha256sum "${APP05_PROJECT_DIR}/build/${APP05_BIN_NAME}"
          sha256sum "web-flasher-stage/app08/${APP08_BIN_NAME}"
          sha256sum "web-flasher-stage/app11/${APP11_BIN_NAME}"

      - name: Assemble Web Flasher catalog
        run: |
          rm -rf site
          mkdir -p site/firmware
          cp -R web-flasher/. site/
          cp "${APP01_PROJECT_DIR}/build/${APP01_BIN_NAME}" "site/firmware/${APP01_BIN_NAME}"
          cp "${APP02_PROJECT_DIR}/build/${APP02_BIN_NAME}" "site/firmware/${APP02_BIN_NAME}"
          cp "${APP03_PROJECT_DIR}/build/${APP03_BIN_NAME}" "site/firmware/${APP03_BIN_NAME}"
          cp "${APP05_PROJECT_DIR}/build/${APP05_BIN_NAME}" "site/firmware/${APP05_BIN_NAME}"
          cp "web-flasher-stage/app08/${APP08_BIN_NAME}" "site/firmware/${APP08_BIN_NAME}"
          cp "web-flasher-stage/app11/${APP11_BIN_NAME}" "site/firmware/${APP11_BIN_NAME}"

      - name: Upload firmware catalog for review
        uses: actions/upload-artifact@v4
        with:
          name: kontakts-web-flasher-catalog
          path: |
            ${{ env.APP01_PROJECT_DIR }}/build/${{ env.APP01_BIN_NAME }}
            ${{ env.APP02_PROJECT_DIR }}/build/${{ env.APP02_BIN_NAME }}
            ${{ env.APP03_PROJECT_DIR }}/build/${{ env.APP03_BIN_NAME }}
            ${{ env.APP05_PROJECT_DIR }}/build/${{ env.APP05_BIN_NAME }}
            web-flasher-stage/app08/${{ env.APP08_BIN_NAME }}
            web-flasher-stage/app11/${{ env.APP11_BIN_NAME }}
            web-flasher/manifest-app01.json
            web-flasher/manifest-app02.json
            web-flasher/manifest-app03.json
            web-flasher/manifest-app05.json
            web-flasher/manifest-app08.json
            web-flasher/manifest-app09.json
            web-flasher/manifest-app11.json
            web-flasher/firmware-list.json
            web-flasher/tests.json
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/agent/app08-youtube-dashboard' || github.ref == 'refs/heads/agent/app11-usb-serial-terminal') || github.event_name == 'workflow_dispatch' && inputs.deploy }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/agent/app08-youtube-dashboard' || github.ref == 'refs/heads/agent/app11-usb-serial-terminal') || github.event_name == 'workflow_dispatch' && inputs.deploy }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/agent/app08-youtube-dashboard' || github.ref == 'refs/heads/agent/app11-usb-serial-terminal') || github.event_name == 'workflow_dispatch' && inputs.deploy }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Web Flasher to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
