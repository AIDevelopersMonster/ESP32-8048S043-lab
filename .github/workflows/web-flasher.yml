# Project: KONTAKTS / ESP32-8048S043 Lab
# Programmer: Sol
# Engineer: Alex Malachevsky

name: Web Flasher - Firmware Catalog

on:
  push:
    branches:
      - main
    paths:
      - "web-flasher/**"
      - ".github/workflows/web-flasher.yml"
  pull_request:
    paths:
      - "web-flasher/**"
      - ".github/workflows/web-flasher.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the KONTAKTS firmware catalog to GitHub Pages"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-flasher-pages
  cancel-in-progress: false

env:
  STABLE_PROJECT_DIR: stable-app07/apps/06_OTARecovery/idf
  STABLE_BIN_NAME: kontakts-platform-v0.2.4-r1-full.bin
  APP16_BIN_NAME: app16-kontakts-platform-v0.3.9-full.bin
  APP16_RELEASE_URL: https://github.com/AIDevelopersMonster/ESP32-8048S043-lab/releases/download/app06-v0.3.9/app06-ota-recovery-v0.3.9-full.bin
  APP16_SHA256: 20d3cd2675e49fa84e1be6ff9dbf0c01a4d3786234138cf4511014b9b4fdbc76
  APP18_BIN_NAME: app18-kontakts-platform-v0.4.0-full.bin
  APP18_RELEASE_URL: https://github.com/AIDevelopersMonster/ESP32-8048S043-lab/releases/download/app06-v0.4.0/app06-ota-recovery-v0.4.0-full.bin
  APP18_SHA256: f2787661fd55a8a6da1cd8131b644d3c874d89182d1cc5a7f057255a777893b0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout physically validated Platform 0.2.4-r1
        uses: actions/checkout@v4
        with:
          ref: 8f054fe79798cd49ac5f0b9098d931811a0239dd
          path: stable-app07

      - name: Build stable KONTAKTS Platform 0.2.4-r1
        run: |
          docker run --rm \
            -e STABLE_BIN_NAME="${STABLE_BIN_NAME}" \
            -e KONTAKTS_APP_VERSION="0.2.4" \
            -v "$PWD:/project" \
            -w "/project/${STABLE_PROJECT_DIR}" \
            espressif/idf:v5.5.5 \
            bash -lc 'git config --global --add safe.directory /project/stable-app07 && idf.py set-target esp32s3 && idf.py build && cd build && esptool.py --chip esp32s3 merge_bin -o "${STABLE_BIN_NAME}" @flash_args'

      - name: Fetch released platform images
        run: |
          mkdir -p .web-flasher-downloads
          curl -fL --retry 5 --retry-delay 3 "$APP16_RELEASE_URL" -o ".web-flasher-downloads/$APP16_BIN_NAME"
          echo "$APP16_SHA256  .web-flasher-downloads/$APP16_BIN_NAME" | sha256sum -c -
          curl -fL --retry 5 --retry-delay 3 "$APP18_RELEASE_URL" -o ".web-flasher-downloads/$APP18_BIN_NAME"
          echo "$APP18_SHA256  .web-flasher-downloads/$APP18_BIN_NAME" | sha256sum -c -

      - name: Verify firmware images
        run: |
          test -s "${STABLE_PROJECT_DIR}/build/${STABLE_BIN_NAME}"
          test -s ".web-flasher-downloads/${APP16_BIN_NAME}"
          test -s ".web-flasher-downloads/${APP18_BIN_NAME}"
          sha256sum "${STABLE_PROJECT_DIR}/build/${STABLE_BIN_NAME}"
          sha256sum ".web-flasher-downloads/${APP16_BIN_NAME}"
          sha256sum ".web-flasher-downloads/${APP18_BIN_NAME}"

      - name: Assemble Web Flasher catalog
        run: |
          rm -rf site
          mkdir -p site/firmware
          cp -R web-flasher/. site/
          cp "${STABLE_PROJECT_DIR}/build/${STABLE_BIN_NAME}" "site/firmware/${STABLE_BIN_NAME}"
          cp ".web-flasher-downloads/${APP16_BIN_NAME}" "site/firmware/${APP16_BIN_NAME}"
          cp ".web-flasher-downloads/${APP18_BIN_NAME}" "site/firmware/${APP18_BIN_NAME}"

      - name: Upload firmware catalog for review
        uses: actions/upload-artifact@v4
        with:
          name: kontakts-web-flasher-catalog
          path: |
            ${{ env.STABLE_PROJECT_DIR }}/build/${{ env.STABLE_BIN_NAME }}
            .web-flasher-downloads/${{ env.APP16_BIN_NAME }}
            .web-flasher-downloads/${{ env.APP18_BIN_NAME }}
            web-flasher/manifest-app07-v024.json
            web-flasher/manifest-app16.json
            web-flasher/manifest-app18.json
            web-flasher/firmware-list.json
            web-flasher/tests.json
          if-no-files-found: error
          include-hidden-files: true

      - name: Configure GitHub Pages
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main') }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main') }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Web Flasher to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
