name: App 05 - Network Provisioning Build

on:
  push:
    branches:
      - main
      - agent/app05-network-provisioning
      - agent/app05-stability
    paths:
      - 'apps/05_NetworkProvisioning/**'
      - '.github/workflows/app05-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - name: Build App05
        working-directory: apps/05_NetworkProvisioning/idf
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
      - name: Merge flash image
        working-directory: apps/05_NetworkProvisioning/idf
        run: |
          . $IDF_PATH/export.sh
          cd build
          esptool.py --chip esp32s3 merge_bin -o app05-network-provisioning-v0.1.1.bin @flash_args
          test -s app05-network-provisioning-v0.1.1.bin
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app05-network-provisioning-v0.1.1
          path: |
            apps/05_NetworkProvisioning/idf/build/app05-network-provisioning-v0.1.1.bin
            apps/05_NetworkProvisioning/idf/partitions.csv
          if-no-files-found: error
