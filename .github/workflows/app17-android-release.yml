name: KONTAKTS Mobile - Android Release

on:
  push:
    branches:
      - main
    paths:
      - 'apps/17_MobileControl/release-version.txt'
      - '.github/workflows/app17-android-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < apps/17_MobileControl/release-version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch exact physically tested App17 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          APP17_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$APP17_VERSION" != "0.1.1" ]]; then
            echo "::error::This release workflow currently has a pinned physically tested artifact only for App17 v0.1.1."
            exit 1
          fi

          mkdir -p app17-release
          gh run download 36507403489             --repo "$GITHUB_REPOSITORY"             --name app17-kontakts-mobile-v0.1.1             --dir app17-release

          test -f app17-release/kontakts-mobile-app17-v0.1.1-debug.apk

          echo "5de40bc802438a35285077241da603b0441ead28179928fad0e15ea0285868d0  app17-release/kontakts-mobile-app17-v0.1.1-debug.apk" | sha256sum -c -

          sha256sum app17-release/kontakts-mobile-app17-v0.1.1-debug.apk             > app17-release/kontakts-mobile-app17-v0.1.1-debug.apk.sha256

      # OTA firmware up to Platform 0.3.9 resolves its manifest through
      # /releases/latest/download/app06-ota.json. Therefore unrelated artifact
      # channels must not become GitHub's global latest release.
      # App17 is a physically accepted MVP/debug APK, so publish it as prerelease.
      - name: Publish permanent GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APP17_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="app17-v${APP17_VERSION}"

          notes="KONTAKTS Mobile App17 ${APP17_VERSION} — PHYSICAL MVP PASS on Xiaomi vince_ru, Android 7.1.2 / API 25, with KONTAKTS Platform 0.3.9. The native Android client connects to BLE device KONTAKTS-8048 (FFF0 / FFF1 WRITE / FFF2 READ) and physically controls a real Ebyte MA01 relay through the common command/service layer, UART1 GPIO17/18 and RS485. This release publishes the exact CI APK from workflow run 36507403489. APK SHA-256: 5de40bc802438a35285077241da603b0441ead28179928fad0e15ea0285868d0. Video: https://youtube.com/shorts/FxDnALva3xM"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" app17-release/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag"               --target "$GITHUB_SHA"               --title "KONTAKTS Mobile App17 ${APP17_VERSION}"               --notes "$notes"               --prerelease               --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" app17-release/*               --target "$GITHUB_SHA"               --title "KONTAKTS Mobile App17 ${APP17_VERSION}"               --notes "$notes"               --prerelease               --repo "$GITHUB_REPOSITORY"
          fi
