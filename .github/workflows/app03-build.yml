# Project: KONTAKTS / ESP32-8048S043 Lab
# Application: App 03 - Live Dashboard
# Programmer: Sol
# Engineer: Alex Malachevsky

name: App 03 - Live Dashboard Build

on:
  push:
    branches:
      - agent/app03-live-dashboard
    paths:
      - "apps/03_LiveDashboard/**"
      - ".github/workflows/app03-build.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP03_PROJECT_DIR: apps/03_LiveDashboard/idf
  APP03_BIN_NAME: app03-live-dashboard-v0.1.0.bin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and merge App 03 with ESP-IDF 5.5.5
        run: |
          docker run --rm \
            -e APP03_BIN_NAME="${APP03_BIN_NAME}" \
            -v "$PWD:/project" \
            -w "/project/${APP03_PROJECT_DIR}" \
            espressif/idf:v5.5.5 \
            bash -lc 'git config --global --add safe.directory /project && idf.py set-target esp32s3 && idf.py build && cd build && esptool.py --chip esp32s3 merge_bin -o "${APP03_BIN_NAME}" @flash_args'

      - name: Verify merged firmware
        run: |
          test -s "${APP03_PROJECT_DIR}/build/${APP03_BIN_NAME}"
          sha256sum "${APP03_PROJECT_DIR}/build/${APP03_BIN_NAME}"
          ls -lh "${APP03_PROJECT_DIR}/build/${APP03_BIN_NAME}"

      - name: Upload App 03 firmware
        uses: actions/upload-artifact@v4
        with:
          name: app03-live-dashboard-v0.1.0
          path: ${{ env.APP03_PROJECT_DIR }}/build/${{ env.APP03_BIN_NAME }}
          if-no-files-found: error
