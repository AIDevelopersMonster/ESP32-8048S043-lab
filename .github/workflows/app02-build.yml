name: App 02 - Mixed Widgets Build

on:
  push:
    branches:
      - agent/app02-mixed-widgets
    paths:
      - "apps/02_MixedWidgets/**"
      - ".github/workflows/app02-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build App 02 with ESP-IDF 5.5.5
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w "/project/apps/02_MixedWidgets/idf" \
            espressif/idf:v5.5.5 \
            bash -lc 'git config --global --add safe.directory /project && idf.py set-target esp32s3 && idf.py build'

      - name: Verify application binary
        run: |
          test -s apps/02_MixedWidgets/idf/build/mixed_widgets_lab.bin
          sha256sum apps/02_MixedWidgets/idf/build/mixed_widgets_lab.bin
          ls -lh apps/02_MixedWidgets/idf/build/mixed_widgets_lab.bin
