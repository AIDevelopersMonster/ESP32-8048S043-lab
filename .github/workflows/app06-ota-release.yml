# Publication checkpoint: Platform 0.3.9 physical PASS (2026-09-29)
name: KONTAKTS Platform - GitHub OTA Release

on:
  push:
    branches:
      - main
    paths:
      - 'apps/06_OTARecovery/release-version.txt'
      - 'apps/06_OTARecovery/idf/**'
      - 'apps/06_OTARecovery/widgets/**'
      - '.github/workflows/app06-ota-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < apps/06_OTARecovery/release-version.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Replace existing candidate release
        env:
          GH_TOKEN: ${{ github.token }}
          APP06_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="app06-v${APP06_VERSION}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Replacing candidate release $tag before physical acceptance."
            gh release delete "$tag" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
          else
            git push origin ":refs/tags/$tag" >/dev/null 2>&1 || true
          fi
      - name: Build OTA and full images
        env:
          GH_TOKEN: ${{ github.token }}
          APP06_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .app06-ota
          if [[ "${APP06_VERSION}" == "0.4.0" ]]; then
            echo "::notice::Publishing the exact App18 hardware/Web-accepted CI artifact from run 36713194827."
            rm -rf .accepted-app18
            gh run download 36713194827 --repo "$GITHUB_REPOSITORY" --name app06-platform-v0.3.9 --dir .accepted-app18
            full_src="$(find .accepted-app18 -type f -name 'app06-ota-recovery-v0.3.9-full.bin' -print -quit)"
            ota_src="$(find .accepted-app18 -type f -name 'app06-ota-v0.3.9.bin' -print -quit)"
            test -n "$full_src"
            test -n "$ota_src"
            cp "$full_src" .app06-ota/app06-ota-recovery-v0.4.0-full.bin
            cp "$ota_src" .app06-ota/app06-ota.bin
            echo "F2787661FD55A8A6DA1CD8131B644D3C874D89182D1CC5A7F057255A777893B0  .app06-ota/app06-ota-recovery-v0.4.0-full.bin" | sha256sum -c -
            echo "F5A494AB887BA010C130C5AFB29F1478FE42BB4D8384B5F136A414842DD554B6  .app06-ota/app06-ota.bin" | sha256sum -c -
          elif [[ "${APP06_VERSION}" == "0.3.9" ]]; then
            echo "::notice::Publishing the exact App16 hardware-accepted CI artifact from run 36491495390."
            rm -rf .accepted-app16
            gh run download 36491495390 --repo "$GITHUB_REPOSITORY" --name app06-platform-v0.3.9 --dir .accepted-app16
            full_src="$(find .accepted-app16 -type f -name 'app06-ota-recovery-v0.3.9-full.bin' -print -quit)"
            ota_src="$(find .accepted-app16 -type f -name 'app06-ota-v0.3.9.bin' -print -quit)"
            test -n "$full_src"
            test -n "$ota_src"
            cp "$full_src" .app06-ota/app06-ota-recovery-v0.3.9-full.bin
            cp "$ota_src" .app06-ota/app06-ota.bin
            echo "20D3CD2675E49FA84E1BE6FF9DBF0C01A4D3786234138CF4511014B9B4FDBC76  .app06-ota/app06-ota-recovery-v0.3.9-full.bin" | sha256sum -c -
          else
            docker run --rm \
              -e KONTAKTS_APP_VERSION="${APP06_VERSION}" \
              -v "$PWD:/project" \
              -w /project/apps/06_OTARecovery/idf \
              espressif/idf:v5.5.5 bash -lc '
                git config --global --add safe.directory /project &&
                idf.py set-target esp32s3 &&
                idf.py build &&
                cp build/app06_ota_recovery.bin /project/.app06-ota/app06-ota.bin &&
                cd build &&
                esptool.py --chip esp32s3 merge_bin -o "/project/.app06-ota/app06-ota-recovery-v${KONTAKTS_APP_VERSION}-full.bin" @flash_args
              '
          fi
      - name: Build manifest
        id: assets
        shell: bash
        run: |
          sha="$(sha256sum .app06-ota/app06-ota.bin | awk '{print $1}')"
          size="$(stat -c '%s' .app06-ota/app06-ota.bin)"
          full_file=".app06-ota/app06-ota-recovery-v${{ steps.version.outputs.version }}-full.bin"
          full_sha="$(sha256sum "$full_file" | awk '{print $1}')"
          version="${{ steps.version.outputs.version }}"
          tag="app06-v${version}"
          firmware_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/app06-ota.bin"
          cat > .app06-ota/app06-ota.json <<EOF
          {"schema":1,"board":"esp32-8048s043-lab-n16r8","app":"app06-ota-recovery","version":"${version}","channel":"stable","size":${size},"sha256":"${sha}","firmware":"${firmware_url}"}
          EOF
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "full_sha256=$full_sha" >> "$GITHUB_OUTPUT"
          sha256sum .app06-ota/app06-ota*.bin
      - name: Attach validated factory recovery
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          mkdir -p .app06-factory
          gh run download 34047113353 --repo "$GITHUB_REPOSITORY" --name app06-github-ota-recovery-v0.1.0 --dir .app06-factory
          src="$(find .app06-factory -type f -name 'app06-ota-recovery-v0.1.0-full.bin' -print -quit)"
          cp "$src" .app06-ota/app06-factory-recovery-v0.1.0-full.bin
          echo "c241682145ff84db8f930d7a80997ea9a60583793456ab3a5cef4a457b01787d  .app06-ota/app06-factory-recovery-v0.1.0-full.bin" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: app06-github-ota-${{ steps.version.outputs.version }}
          path: .app06-ota/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          APP06_VERSION: ${{ steps.version.outputs.version }}
          APP06_SHA256: ${{ steps.assets.outputs.sha256 }}
          APP06_SIZE: ${{ steps.assets.outputs.size }}
          APP06_FULL_SHA256: ${{ steps.assets.outputs.full_sha256 }}
        shell: bash
        run: |
          tag="app06-v${APP06_VERSION}"
          notes="KONTAKTS Platform ${APP06_VERSION} — PHYSICAL PASS on ESP32-8048S043 Sample A (2026-09-30). Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}. OTA SHA-256 ${APP06_SHA256}, size ${APP06_SIZE}. Full image SHA-256 ${APP06_FULL_SHA256}. Includes the merged full image for initial install/Web Flasher. Platform 0.4.0 adds the App18 Climate Controller for EID041 + MA01 over shared Modbus RTU, configurable temperature/humidity hysteresis, 60-second stale-data grace and FAILSAFE behavior, SD HMI, and a responsive local /climate page for phone/desktop control through the common command/service layer. AUTO ON reserves MA01 for climate control; AUTO OFF releases external relay control. The dedicated MA01-link-loss bench test remains deferred because it requires rewiring the current stand. SD Help/application content is released independently via app09-sd-current."
          gh release create "$tag" .app06-ota/* --target "$GITHUB_SHA" --title "KONTAKTS Platform ${APP06_VERSION}" --notes "$notes" --repo "$GITHUB_REPOSITORY"
